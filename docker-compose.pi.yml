version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skinnerbox-backend
    ports:
      - "5001:5000"
    volumes:
      - ./backend:/app

    # ✅ real GPIO access on the Pi
    privileged: true
    devices:
      - /dev/gpiomem:/dev/gpiomem
      - /dev/spidev0.0:/dev/spidev0.0
      - /dev/i2c-1:/dev/i2c-1

    environment:
      - GPIO_MODE=real
      - FLASK_APP=sbBackend.py
      - FLASK_DEBUG=0   # recommend 0 on Pi for stability with GPIO

    command: flask run --host=0.0.0.0 --port=5000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skinnerbox-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

    environment:
      # ✅ IMPORTANT: inside docker, localhost is the frontend container, not the backend
      # Use service name "backend" to reach the backend container
      - REACT_APP_BACKEND_URL=http://backend:5000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

    restart: unless-stopped
